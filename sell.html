<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vinde o mașină – MaxMotors</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="sell"><header id="h"></header><main class="wrap"><div class="auth" style="max-width:640px"><h2>Vinde-ți mașina pe <span>MaxMotors</span></h2><form class="card"><label for="t">Titlul anunțului</label><input id="t" required><label for="m">Marcă</label><select id="m"><option>Škoda</option><option>Dacia</option><option>Volkswagen</option><option>Toyota</option><option>Renault</option><option>Porsche</option></select><label for="mo">Model</label><input id="mo" required><label for="y">An</label><input id="y" type="number" min="1990" max="2026" required><label for="fu">Combustibil</label><select id="fu"><option>Benzină</option><option>Diesel</option><option>Hibrid</option><option>Electric</option></select><label for="g">Cutie de viteze</label><select id="g"><option>Manuală</option><option>Automată</option></select><label for="p">Preț (€)</label><input id="p" type="number" min="0" required><label for="c">Oraș</label><input id="c" required><label for="ph">Fotografii</label><input id="ph" type="file" accept="image/*" multiple><label for="d">Descriere</label><textarea id="d" rows="4"></textarea><label for="tel">Telefon</label><input id="tel" type="tel" required><button class="btn" style="width:100%;margin-top:18px">Publică anunțul</button></form></div></main><footer id="f"></footer><script src="js/app.js"></script></body></html>
